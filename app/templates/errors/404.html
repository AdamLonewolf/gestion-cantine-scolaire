{% extends "base.html" %}

{% block title %}Page Non Trouvée (404) - CantineMaster{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-16 text-center">
  <div class="bg-white rounded-3xl border border-slate-200/80 shadow-md p-8 sm:p-10">
    <div class="w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-3xl mx-auto mb-4">
      🔍
    </div>
    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">404 - Ressource Introuvable</h1>
    <p class="text-sm text-slate-500 mt-2">
      La page ou l'enregistrement recherché n'existe pas ou a été déplacé.
    </p>
    <div class="mt-6">
      <a href="{{ url_for('main.dashboard') }}" 
         class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold transition-all shadow-xs">
        Retour au tableau de bord
      </a>
    </div>
  </div>
</div>
{% endblock %}
